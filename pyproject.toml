[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-harness"
description = "Experimental local CLI for evidence-based Task completion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jgoneit"}]
keywords = ["agent", "cli", "evidence", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dynamic = ["version"]
dependencies = [
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",
]

[project.urls]
Homepage = "https://github.com/jgoneit/harness"
Repository = "https://github.com/jgoneit/harness"

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
test = []
release = [
    "build>=1.2",
    "twine>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
harness = ["resources/*.md", "resources/*.json"]

[tool.setuptools.dynamic]
version = {attr = "harness.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
